<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kavim">
  <rect width="64" height="64" rx="14" fill="#0f766e" />
  <!-- Three lines = "kavim" (קווים). The last one is short: a review in progress. -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <line x1="14" y1="22" x2="50" y2="22" />
    <line x1="14" y1="32" x2="50" y2="32" />
    <line x1="14" y1="42" x2="34" y2="42" />
  </g>
  <circle cx="46" cy="42" r="5" fill="#5eead4" />
</svg>
