name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  # ══════════════════════════════════════════════════════════════════════
  #  backend
  # ══════════════════════════════════════════════════════════════════════
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kavim
          POSTGRES_PASSWORD: kavim_test
          POSTGRES_DB: kavim_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kavim -d kavim_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://kavim:kavim_test@localhost:5432/kavim_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      APP_ENV: development
      LOG_JSON: 'false'
      LOG_LEVEL: WARNING
      SECRET_KEY: ci_test_secret_key_not_used_in_production_padding

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev

      # The schema extensions are created by the compose init script, which does
      # not run for a GitHub service container.
      - name: Create Postgres extensions
        run: |
          PGPASSWORD=kavim_test psql -h localhost -U kavim -d kavim_test \
            -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;' \
            -c 'CREATE EXTENSION IF NOT EXISTS citext;' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;' \
            -c 'CREATE EXTENSION IF NOT EXISTS btree_gin;'

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy strict)
        run: uv run mypy app

      - name: Module boundaries (import-linter)
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest

      # Enabled from Phase 1, once migrations exist.
      - name: Migration round-trip
        if: hashFiles('backend/alembic/versions/*.py') != ''
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  # ══════════════════════════════════════════════════════════════════════
  #  frontend
  # ══════════════════════════════════════════════════════════════════════
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Includes the RTL rule that bans physical CSS properties (CLAUDE.md rule 1).
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════
  #  security
  # ══════════════════════════════════════════════════════════════════════
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Python dependency audit
        working-directory: backend
        run: |
          uv sync --extra dev
          uv run --with pip-audit pip-audit --ignore-vuln GHSA-none || true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Node dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

  # ══════════════════════════════════════════════════════════════════════
  #  docker build
  # ══════════════════════════════════════════════════════════════════════
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: build
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
