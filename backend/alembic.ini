[alembic]
script_location = alembic
prepend_sys_path = .
# Explicit, so Alembic does not fall back to legacy splitting on spaces and
# colons — which breaks on Windows paths like C:\Projects.
path_separator = os

# Timestamped, descriptive filenames so `ls versions/` reads as a history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# The URL is supplied by env.py from app.core.config so there is exactly one
# source of truth for it. Intentionally left blank here.
sqlalchemy.url =

timezone = UTC

[post_write_hooks]
# Autogenerated migrations get formatted like the rest of the codebase.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
