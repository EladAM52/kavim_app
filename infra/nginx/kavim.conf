# ══════════════════════════════════════════════════════════════════════════
#  Kavim behind nginx, served under /kavim
#
#  Install on the server:
#    sudo cp infra/nginx/kavim.conf /etc/nginx/snippets/kavim.conf
#    # then inside the existing `server { ... }` block for the host:
#    #   include /etc/nginx/snippets/kavim.conf;
#    sudo nginx -t && sudo systemctl reload nginx
#
#  The trailing slash on every proxy_pass is load-bearing: it makes nginx strip
#  the /kavim prefix before forwarding, so the application keeps routing at the
#  root and needs no knowledge of where it is mounted. The one thing that cannot
#  be stripped is the refresh cookie's path, which the browser matches against
#  the address bar — that is what APP_PUBLIC_PATH in .env is for.
#
#  ── THE PORT ──────────────────────────────────────────────────────────────
#  Every proxy_pass below points at 127.0.0.1:8000, which must equal
#  BACKEND_PORT in .env. Change one and you must change the other, or nginx
#  proxies to a port nothing is listening on and every request is a 502:
#
#      sed -i 's/127.0.0.1:8000/127.0.0.1:9000/g' /etc/nginx/snippets/kavim.conf
#
#  nginx cannot read .env, and an `upstream` block cannot live in a snippet
#  included inside `server { }`, so this stays a manual two-place edit.
# ══════════════════════════════════════════════════════════════════════════

# The SPA and every client-side route.
location /kavim/ {
    proxy_pass http://127.0.0.1:8000/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Without this the application believes it is on plain HTTP, and any
    # absolute URL it builds comes out as http:// on an https:// site.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Prefix /kavim;

    # WebSocket upgrade, for the live board in Phase 6. Harmless until then.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout  60s;
    proxy_send_timeout  60s;
    # Attachment uploads are capped at 25 MB by UPLOAD_MAX_BYTES; nginx has to
    # allow at least as much or it rejects the request before the app can.
    client_max_body_size 25m;
}

# /kavim with no trailing slash — without this it 404s, which is the first
# thing anybody types.
location = /kavim {
    return 301 /kavim/;
}

# Hashed, immutable build artefacts. Vite fingerprints every filename, so a
# long cache is safe and a new deploy invalidates it by changing the name.
location /kavim/assets/ {
    proxy_pass http://127.0.0.1:8000/assets/;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# index.html must never be cached, or a browser keeps loading the previous
# deploy's asset URLs after a release.
location = /kavim/index.html {
    proxy_pass http://127.0.0.1:8000/index.html;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store";
}

# ── in the http { } block, once per nginx install ─────────────────────────
# The WebSocket upgrade map that `Connection $connection_upgrade` needs:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# ── a note about /health ──────────────────────────────────────────────────
# `/kavim/health/ready` is reachable through the catch-all above, and the SPA's
# system-status screen calls it, so it must stay reachable. It is unauthenticated
# and reports which dependency is down — a small information leak, accepted
# because monitoring needs it and it exposes no data. To restrict it to the
# monitoring network instead, add before the catch-all:
#
#   location = /kavim/health/ready {
#       proxy_pass http://127.0.0.1:8000/health/ready;
#       proxy_set_header Host $host;
#       allow 10.0.0.0/8;
#       deny all;
#   }
#
# …and accept that the status screen then shows "unreachable" for everyone else.
#
# `/docs`, `/redoc`, and `/openapi.json` need no rule: FastAPI serves none of
# them when APP_ENV=production (`main.py`).
